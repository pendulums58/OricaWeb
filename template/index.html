<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyanPro Card Database</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="decode.js"></script>
<script src="deck.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f5f7; --surface:#fff; --surface-2:#e6ebef; --surface-3:#d9e1e6;
  --fg:#101820; --fg-dim:#56636d; --fg-faint:#85939e;
  --line:#ccd5dc; --line-soft:#e0e7ec;
  --accent:#0a7c89; --accent-soft:#d6eff2;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 6px 18px rgba(16,24,32,.05);
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-normal:#b88b1c; --f-effect:#bf6024; --f-ritual:#3769bd; --f-fusion:#7b4cb8;
  --f-synchro:#7c8894; --f-xyz:#363c45; --f-link:#2a53a3;
  --f-spell:#13906d; --f-trap:#ab2e73;
  --f-access:#0c9eb0; --f-pairing:#cd4b80; --f-gift:#c5861b;
  --f-key:#3f9a46; --f-hijack:#1a6f85;
  --a-earth:#9a7343; --a-water:#2f7fc4; --a-fire:#c6442f; --a-wind:#2f9e62;
  --a-light:#c79a16; --a-dark:#7b52b0; --a-divine:#b8761a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1115; --surface:#141d23; --surface-2:#1c262e; --surface-3:#26323a;
  --fg:#e5edf2; --fg-dim:#90a0ac; --fg-faint:#6d7e8a;
  --line:#293640; --line-soft:#1f2b33;
  --accent:#39d0e0; --accent-soft:#102f37;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --f-normal:#d6b449; --f-effect:#e08a4c; --f-ritual:#6b9ee0; --f-fusion:#a87ee0;
  --f-synchro:#a9b5c1; --f-xyz:#848d99; --f-link:#5a86d6;
  --f-spell:#39c09e; --f-trap:#e05fa0;
  --f-access:#2ec6d8; --f-pairing:#ec7aa8; --f-gift:#e8b44d;
  --f-key:#6ec971; --f-hijack:#3fa8c0;
  --a-earth:#c49a63; --a-water:#5aa8e0; --a-fire:#e86d55; --a-wind:#52c489;
  --a-light:#e3bf45; --a-dark:#a87fd8; --a-divine:#dfa044;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

header.top{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
header.top .brandrow{display:flex;align-items:center;gap:12px;padding-block:13px 9px;flex-wrap:wrap}
.refresh{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;
  color:var(--fg-dim);border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  background:var(--surface-2);white-space:nowrap}
.refresh:hover{border-color:var(--accent);color:var(--accent)}
.refresh[disabled]{opacity:.5;cursor:default}
.refresh .sp{display:inline-block;font-family:var(--font-mono);font-size:12px;line-height:1}
.refresh.spin .sp{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{padding:46px 10px;text-align:center;color:var(--fg-dim);font-size:13px}
.loading .barwrap{max-width:280px;margin:14px auto 0;height:5px;border-radius:3px;
  background:var(--surface-3);overflow:hidden}
.loading .barwrap i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.loading .step{font-family:var(--font-mono);font-size:11px;color:var(--fg-faint);margin-top:9px}
.livetag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:1px 7px;white-space:nowrap}
.gear{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg-dim);font-size:13px}
.gear:hover{border-color:var(--accent);color:var(--accent)}
.adminpanel{border:1px solid var(--line);border-radius:11px;background:var(--surface);
  padding:14px 16px;margin:0 0 18px}
.adminpanel h3{margin:0 0 6px;font-size:13px;font-weight:700}
.adminpanel p{margin:0 0 10px;font-size:12.2px;line-height:1.6;color:var(--fg-dim)}
.adminrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adminrow input{flex:1;min-width:200px;height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);color:var(--fg);font-family:var(--font-mono);font-size:12px}
.adminrow input:focus{border-color:var(--accent);outline:none}
.abtn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.abtn[disabled]{opacity:.5;cursor:default}
.abtn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.abtn.go:hover{color:#fff;filter:brightness(1.08)}
.astatus{font-size:12px;color:var(--fg-dim);margin-top:9px;min-height:17px}
.astatus.err{color:var(--f-trap)}
.astatus.ok{color:var(--good,#2f8f54)}
.builtat{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;font-size:13px;font-weight:500;color:var(--fg-dim);padding:8px 13px 10px;
  white-space:nowrap;border-bottom:2px solid transparent;text-decoration:none}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);margin-left:5px}
.tab[aria-current="page"] .n{color:var(--accent)}
h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.015em}
h1 a{text-decoration:none}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-family:var(--font-mono);font-size:11px;color:var(--fg-faint);letter-spacing:.02em}
main{padding-block:26px 56px;min-height:60vh}

.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.packcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .14s,transform .1s}
.packcard:hover{border-color:var(--accent);transform:translateY(-3px)}
.fan{height:124px;background:linear-gradient(170deg,var(--surface-2),var(--surface-3));position:relative;overflow:hidden}
.fan img{position:absolute;top:16px;width:74px;aspect-ratio:59/86;object-fit:cover;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.18)}
.fan img:nth-child(1){left:50%;transform:translateX(-50%) rotate(-11deg);margin-left:-52px;z-index:1}
.fan img:nth-child(2){left:50%;transform:translateX(-50%);top:9px;z-index:3}
.fan img:nth-child(3){left:50%;transform:translateX(-50%) rotate(11deg);margin-left:52px;z-index:2}
.packcard .body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:3px}
.packcard .code{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;color:var(--accent);font-weight:500}
.packcard .nm{font-size:14.5px;font-weight:600;line-height:1.32;text-wrap:balance}
.packcard .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-faint);margin-top:2px}

.backrow{margin-bottom:15px}
.back{font-size:12.5px;color:var(--fg-dim);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:var(--surface);text-decoration:none}
.back:hover{border-color:var(--accent);color:var(--accent)}
.packhead{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
.packhead h2{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.packhead .line{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-dim);display:flex;gap:14px;flex-wrap:wrap}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.filter{flex:1;min-width:190px;max-width:340px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px}
.filter:focus{border-color:var(--accent);outline:none}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(144px,1fr));gap:13px;list-style:none;margin:0;padding:0}
.cardcell{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;width:100%;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .14s,transform .1s}
.cardcell:hover{border-color:var(--accent);transform:translateY(-3px)}
.cardcell .strip{height:3px;background:var(--fc,var(--line))}
.cardcell .pic{aspect-ratio:59/86;background:var(--surface-2);position:relative}
.cardcell .pic img{width:100%;height:100%;object-fit:cover;display:block}
.cardcell .pic .attr{position:absolute;top:6px;right:6px}
.cardcell .cap{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cardcell .no{font-family:var(--font-mono);font-size:9.5px;color:var(--fg-faint);letter-spacing:.05em}
.cardcell .nm{font-size:11.8px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cardcell .ft{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-dim);margin-top:1px}
.pip{width:7px;height:7px;border-radius:2px;background:var(--fc,var(--line));flex:0 0 auto}
.twoside{position:absolute;left:6px;bottom:6px;font-size:9.5px;font-family:var(--font-mono);background:rgba(8,14,18,.72);color:#fff;border-radius:999px;padding:2px 7px;letter-spacing:.04em}

.attr{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--ac,var(--fg-dim));box-shadow:0 1px 3px rgba(0,0,0,.3)}
.attr svg{width:13px;height:13px;fill:#fff}
.attr.lg{width:30px;height:30px}
.attr.lg svg{width:18px;height:18px}
/* icons/ 에 파일이 있으면 배지 대신 그림을 그대로 쓴다 */
.attr.custom{background:none;box-shadow:none;width:19px;height:19px}
.attr.custom.lg{width:28px;height:28px}
.attr.custom img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.stars{display:inline-flex;gap:2px;flex-wrap:wrap;align-items:center}
.stars svg{width:13px;height:13px;fill:var(--a-light)}
.stars.rank svg{fill:var(--f-xyz)}
.stars img{width:14px;height:14px;object-fit:contain;display:block}
.linkgrid{display:grid;grid-template-columns:repeat(3,9px);grid-template-rows:repeat(3,9px);gap:2px}
.linkgrid i{background:var(--surface-3);border-radius:2px}
.linkgrid i.on{background:var(--f-link)}
.linkgrid i.mid{background:transparent;border:1px solid var(--line)}

dialog{border:none;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(4,10,14,.62)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(680px,94vw);max-height:88vh;overflow-y:auto;color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mtop{height:4px;background:var(--fc,var(--line))}
.inner{padding:20px}
.closerow{display:flex;justify-content:flex-end;margin:-6px -6px 2px 0}
.close{font-size:12.5px;color:var(--fg-dim);padding:5px 10px;border-radius:8px}
.close:hover{background:var(--surface-2)}
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.dhead .art{width:150px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);overflow:hidden;aspect-ratio:59/86;background:var(--surface-2)}
.dhead .art img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo{flex:1;min-width:200px}
.dnum{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:3px}
.dinfo h3{margin:0 0 10px;font-size:19px;font-weight:700;line-height:1.3;text-wrap:balance}
.drow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.typeline{font-size:12.5px;color:var(--fg-dim)}
.typeline b{color:var(--fg);font-weight:600}
.atkdef{display:flex;gap:16px;font-family:var(--font-mono);font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.atkdef span{color:var(--fg-faint);font-size:10.5px;letter-spacing:.08em;display:block}
.atkdef b{font-weight:600;font-size:15px}
.ctext{background:var(--surface-2);border-radius:10px;padding:14px 15px;font-size:12.9px;line-height:1.72;white-space:pre-wrap;margin-bottom:13px}
.artstrip{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}
.artbtn{width:46px;aspect-ratio:59/86;border-radius:5px;overflow:hidden;border:2px solid var(--line);
  padding:0;background:var(--surface-2);transition:border-color .12s,transform .08s}
.artbtn img{width:100%;height:100%;object-fit:cover;display:block}
.artbtn:hover{transform:translateY(-2px)}
.artbtn[aria-current="true"]{border-color:var(--fc,var(--accent))}
.artlabel{font-size:10.5px;color:var(--fg-faint);font-family:var(--font-mono);
  align-self:center;margin-right:3px;white-space:nowrap}
.flipbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:5px 13px;background:var(--surface-2);color:var(--fg-dim)}
.flipbtn:hover{border-color:var(--accent);color:var(--accent)}
.flipbtn .sw{font-family:var(--font-mono);font-size:13px;line-height:1}
.facetag{font-size:10.5px;font-family:var(--font-mono);letter-spacing:.06em;color:var(--fc);border:1px solid var(--fc);border-radius:999px;padding:2px 9px}
.taggroups{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.taggroup{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.taglabel{flex:0 0 auto;font-size:10.5px;color:var(--fg-faint);border:1px solid var(--line);border-radius:999px;padding:2px 10px;letter-spacing:.03em;white-space:nowrap}
.tag{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px}
.tag.grey{background:var(--surface-2);color:var(--fg-dim)}
.creditrow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 13px;padding-top:11px;border-top:1px solid var(--line-soft)}
.note{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)}
.pagehead{margin-bottom:18px}
.pagehead h2{margin:0 0 5px;font-size:21px;font-weight:700;letter-spacing:-.02em}
.pagehead p{margin:0;font-size:12.5px;color:var(--fg-dim)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fchip{font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg-dim)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.fchip .dot{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--sw);margin-right:6px;vertical-align:1px}

.warnbox{border:1px solid var(--warnline,#d98f2a);background:color-mix(in srgb,#d98f2a 10%,transparent);
  border-radius:11px;padding:13px 15px;margin-bottom:20px}
.warnbox h3{margin:0 0 7px;font-size:13px;font-weight:700}
.warnbox p{margin:0 0 9px;font-size:12.3px;line-height:1.6;color:var(--fg-dim)}
.drifttable{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11.5px}
.drifttable th{text-align:left;font-weight:500;color:var(--fg-faint);padding:4px 10px 4px 0;font-size:10.5px;letter-spacing:.05em}
.drifttable td{padding:3px 10px 3px 0;border-top:1px solid var(--line-soft)}
.drifttable .bad{color:var(--f-trap)}
.drifttable .good{color:var(--accent)}

/* 할당 현황 — 스프레드시트 느낌 */
.sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:22px}
table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
table.sheet th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;
  letter-spacing:.05em;color:var(--fg-dim);font-weight:600;padding:8px 12px;white-space:nowrap;
  border-bottom:1px solid var(--line);z-index:1}
table.sheet td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.sheet tr:last-child td{border-bottom:none}
table.sheet tbody tr:hover{background:var(--surface-2)}
table.sheet td.id{font-family:var(--font-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
table.sheet td.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sheet td.code{font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
table.sheet td.who{font-weight:600}
table.sheet td.who.none{font-weight:400;color:var(--fg-faint);font-style:italic}
.gauge{display:flex;align-items:center;gap:8px;min-width:120px}
.gbar{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:52px}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.gbar i.full{background:var(--f-trap)}
.gbar i.high{background:var(--f-gift)}
.gnum{font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.statetag{font-size:10.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--fg-dim);white-space:nowrap}
.statetag.active{border-color:var(--accent);color:var(--accent)}
.statetag.done{border-color:var(--f-synchro);color:var(--f-synchro)}
.rowcards{font-size:11.5px;color:var(--fg-dim)}
.rowcards button{font-size:11.5px;color:var(--accent);text-decoration:underline;padding:0}
.subrow td{background:var(--surface-2);padding-top:4px;padding-bottom:10px}
.cardlist{display:flex;flex-wrap:wrap;gap:5px}
.cardlist span{font-size:11px;font-family:var(--font-mono);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.howto{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:22px;background:var(--surface)}
.howto h3{margin:0 0 8px;font-size:12.5px;font-weight:700}
.howto p{margin:0 0 9px;font-size:12.3px;line-height:1.65;color:var(--fg-dim)}
.howto pre{margin:0;font-family:var(--font-mono);font-size:11px;line-height:1.6;background:var(--surface-2);
  border-radius:8px;padding:11px 12px;overflow-x:auto}
.secthead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.secthead h3{margin:0;font-size:14px;font-weight:700}
.secthead span{font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)}
.statbar{display:flex;align-items:center;gap:8px;min-width:132px}
.statbar .track{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:56px}
.statbar .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.statbar .pct{font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);
  font-variant-numeric:tabular-nums;white-space:nowrap}

<script>
const ATTRS = {
  "땅":["earth","--a-earth"], "물":["water","--a-water"], "불":["fire","--a-fire"],
  "바람":["wind","--a-wind"], "빛":["light","--a-light"], "어둠":["dark","--a-dark"],
  "신":["divine","--a-divine"]
};
const MARKER_CELLS = ["↖","↑","↗","←",null,"→","↙","↓","↘"];
const SUMMON_TYPES = ["액세스","페어링","기프트","키","하이잭"];
const CLASSIC_TYPES = ["융합","싱크로","엑시즈","링크","의식"];

const view = document.getElementById("view");
const topsub = document.getElementById("topsub");
const modal = document.getElementById("cardModal");
const modalBody = document.getElementById("modalBody");
const mtop = document.getElementById("mtop");
let packs = [];
let allCards = [];
let constants = { groups: [], drift: [], custom: [], source: null };
let allocations = { ranges: [], setcodes: [], issues: [], rules: {} };
let stats = null;   // null = 끄거나 아직 못 받음
let deckStats = null;
let lflist = { name: null, limits: new Map(), issues: [] };
let openState = null;
let icons = {};
const cache = new Map();
const byId = new Map();

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const svgUse = id => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#" + id);
  s.append(u);
  return s;
};
const frameVar = c => `var(--f-${c.frame || "effect"})`;

function attrBadge(name, big) {
  if (!name || !ATTRS[name]) return null;
  const [glyph, color] = ATTRS[name];
  const custom = icons["attr-" + glyph];
  const d = el("span", "attr" + (big ? " lg" : "") + (custom ? " custom" : ""));
  d.title = name + " 속성";
  d.setAttribute("aria-label", name + " 속성");
  if (custom) {
    const im = el("img"); im.src = custom; im.alt = ""; im.loading = "lazy";
    d.append(im);
  } else {
    d.style.setProperty("--ac", `var(${color})`);
    d.append(svgUse("g-" + glyph));
  }
  return d;
}
function starRow(n, isRank) {
  const box = el("span", "stars" + (isRank ? " rank" : ""));
  const custom = icons[isRank ? "rank" : "level"];
  for (let i = 0; i < Math.min(n, 13); i++) {
    if (custom) {
      const im = el("img"); im.src = custom; im.alt = ""; im.loading = "lazy";
      box.append(im);
    } else {
      box.append(svgUse("g-star"));
    }
  }
  box.title = (isRank ? "랭크 " : "레벨 ") + n;
  return box;
}
function linkGrid(markers) {
  const g = el("span", "linkgrid");
  const on = new Set(markers || []);
  MARKER_CELLS.forEach(m => g.append(el("i", m === null ? "mid" : (on.has(m) ? "on" : ""))));
  g.title = "링크 마커 " + (markers || []).join(" ");
  return g;
}

/* ---------- 라이브 로딩 ---------- */
/* cdb 를 GitHub 에서 직접 받아 브라우저에서 해석한다. 빌드를 기다리지 않는다. */

let CONFIG = null;
let loadedAt = null;
let buildWarnings = [];

const RAW = (r, path) =>
  `https://raw.githubusercontent.com/${r.owner}/${r.repo}/${r.branch}/${path}`;

const grabJson = async (path, fallback) => {
  try { return await (await fetch(path, { cache: "no-cache" })).json(); }
  catch { return fallback; }
};

const grabText = async (url) => {
  try {
    const res = await fetch(url, { cache: "no-cache" });
    return res.ok ? await res.text() : null;
  } catch { return null; }
};

function showProgress(label, pct) {
  const host = document.getElementById("view");
  let box = host.querySelector(".loading");
  if (!box) {
    host.textContent = "";
    box = el("div", "loading");
    box.append(el("div", null, "카드 데이터를 불러오는 중"));
    const wrap = el("div", "barwrap");
    wrap.append(el("i"));
    box.append(wrap, el("div", "step"));
    host.append(box);
  }
  box.querySelector(".barwrap i").style.width = Math.round(pct * 100) + "%";
  box.querySelector(".step").textContent = label;
}

function showBuiltAt() {
  const host = document.getElementById("builtat");
  if (!loadedAt) { host.textContent = ""; return; }
  const mins = Math.floor((Date.now() - loadedAt) / 60000);
  host.textContent = mins < 1 ? "방금 읽음" : `${mins}분 전 읽음`;
  host.title = new Date(loadedAt).toLocaleString("ko-KR");
}

async function listCdbFiles(repo) {
  // 1순위: GitHub API (항상 최신). 막히면 직전에 받아둔 목록, 그다음 빌드가 남긴 목록.
  const api = `https://api.github.com/repos/${repo.owner}/${repo.repo}/git/trees/${repo.branch}?recursive=1`;
  try {
    const res = await fetch(api, { cache: "no-cache" });
    if (!res.ok) throw new Error("목록 조회 " + res.status);
    const data = await res.json();
    const files = (data.tree || [])
      .filter(t => t.type === "blob" && /\.cdb$/i.test(t.path))
      .map(t => t.path);
    if (files.length) {
      try { localStorage.setItem("orica_cdb_list", JSON.stringify(files)); } catch {}
      return files;
    }
  } catch (err) {
    buildWarnings.push("파일 목록을 받지 못했다: " + err.message);
  }

  try {
    const cached = JSON.parse(localStorage.getItem("orica_cdb_list") || "[]");
    if (cached.length) {
      buildWarnings.push("직전에 받아둔 파일 목록을 썼다 — 새 cdb 는 빠질 수 있다");
      return cached;
    }
  } catch {}

  const fallback = await grabJson("data/cdbs.json", []);
  if (fallback.length) {
    buildWarnings.push("빌드가 남긴 파일 목록을 썼다 — 그 뒤에 추가된 cdb 는 빠질 수 있다");
    return fallback;
  }
  return [];
}

async function loadAll() {
  buildWarnings = [];
  if (!CONFIG) CONFIG = await grabJson("config.json", null);
  if (!CONFIG) throw new Error("config.json 을 읽지 못했다");

  const card = CONFIG.cardRepo, engine = CONFIG.engineRepo;

  showProgress("설정을 읽는 중", 0.05);
  const [extraTypes, packMeta, allocSrc, iconMap, webpList, lflistSrc] = await Promise.all([
    grabJson("types.extra.json", {}),
    grabJson("packs.meta.json", {}),
    grabJson("allocations.json", { ranges: [], setcodes: [] }),
    grabJson("data/icons.json", {}),
    grabJson("data/webp.json", null),
    grabJson("lflist.json", null),
  ]);
  icons = iconMap || {};
  webpSet = Array.isArray(webpList) ? new Set(webpList) : null;

  showProgress("카드 파일 목록을 받는 중", 0.12);
  const files = await listCdbFiles(card);
  if (!files.length) throw new Error("cdb 파일을 찾지 못했다");

  showProgress("SQLite 엔진을 준비하는 중", 0.2);
  const SQL = await initSqlJs({ locateFile: f => CONFIG.sqlJs + f });

  const rows = [];
  for (let i = 0; i < files.length; i++) {
    const name = files[i].split("/").pop();
    showProgress(`${name} (${i + 1}/${files.length})`, 0.25 + 0.55 * (i / files.length));
    const res = await fetch(RAW(card, files[i]), { cache: "no-cache" });
    if (!res.ok) { buildWarnings.push(`${name} 을 받지 못했다 (${res.status})`); continue; }
    const buf = new Uint8Array(await res.arrayBuffer());
    let db;
    try { db = new SQL.Database(buf); } catch { buildWarnings.push(`${name} 을 열지 못했다`); continue; }
    try {
      const out = db.exec(
        "select t.id,t.name,t.desc,d.ot,d.alias,d.setcode,d.type,d.atk,d.def,d.level,d.race,d.attribute" +
        " from texts t join datas d on d.id=t.id");
      if (out.length) {
        const cols = out[0].columns;
        for (const v of out[0].values) {
          const r = {};
          cols.forEach((c, j) => { r[c] = v[j]; });
          r.source = name;
          rows.push(r);
        }
      }
    } catch (e) {
      buildWarnings.push(`${name} 을 읽지 못했다: ${e.message}`);
    } finally { db.close(); }
  }

  showProgress("카드를 해석하는 중", 0.85);
  const built = OricaDecode.buildAll(rows, { extraTypes, packMeta });
  allCards = built.allCards;
  packs = built.packs;
  buildWarnings.push(...built.warnings);

  byId.clear();
  for (const c of allCards) byId.set(c.id, c);
  cache.clear();
  for (const p of packs) cache.set(p.code, p);

  // 이미지 경로: 빌드된 webp 가 있으면 그걸, 없으면 원본을 직접 쓴다
  const pics = CONFIG.picsDir || "pics";
  const pick = id => iconHasWebp(id) ? `img/${id}.webp` : RAW(card, `${pics}/${id}.jpg`);
  for (const c of allCards) {
    c.img = pick(c.id);
    if (c.back) c.back.img = pick(c.back.id);
    for (const a of c.arts || []) a.img = pick(a.id);
  }

  showProgress("할당표를 대조하는 중", 0.92);
  allocations = OricaDecode.reconcile(allocSrc, rows, built.nameOf, built.usedIds);

  // 금제. 없으면 전 카드 3장으로 돌아간다
  lflist = OricaDecode.parseLflist(lflistSrc, built.familyOf);
  if (lflistSrc && lflist.issues.length)
    buildWarnings.push("금제 파일: " + lflist.issues.join(", "));

  showProgress("코드 일람을 읽는 중", 0.96);
  const [header, lua] = await Promise.all([
    grabText(RAW(engine, engine.header || "gframe/ocgapi_constants.h")),
    grabText(RAW(card, CONFIG.luaConstants || "script/constant.lua")),
  ]);
  constants = OricaDecode.parseConstants(
    header, lua, Object.keys(extraTypes).filter(k => !k.startsWith("_")));
  if (!header) buildWarnings.push("엔진 헤더를 받지 못해 코드 일람이 비어 있다");

  loadedAt = Date.now();
  topsub.textContent = `카드 ${allCards.length} · 팩 ${packs.length}`;
  showBuiltAt();
  renderTabs();
}

function renderTabs() {
  const host = document.getElementById("tabs");
  host.textContent = "";
  const active = currentTab();
  for (const t of TABS) {
    if (t.hidden && t.hidden()) continue;
    const a = el("a", "tab");
    a.href = "#" + t.id;
    a.append(document.createTextNode(t.label));
    const n = t.count();
    if (n) a.append(el("span", "n", String(n)));
    if (t.id === active) a.setAttribute("aria-current", "page");
    host.append(a);
  }
}

function currentTab() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!h) return "cards";
  if (h === "deck" || h.startsWith("deck=")) return "deck";   // #deck=... 는 공유받은 덱
  if (["packs", "constants", "cards", "alloc", "stats", "decks"].includes(h)) return h;
  return "packs";   // #RS01 같은 팩 코드
}

function renderList() {

function cardCell(c) {
  const b = el("button", "cardcell");
  b.style.setProperty("--fc", frameVar(c));

  if (badge) pic.append(badge);
  if (c.back) pic.append(el("span", "twoside", "양면"));
  else if (c.arts && c.arts.length > 1)
    pic.append(el("span", "twoside", `일러 ${c.arts.length}`));
  b.append(pic);

  const cap = el("div", "cap");
  if (c.number) cap.append(el("span", "no", c.number));
  cap.append(el("span", "nm", c.name));
  const ft = el("div", "ft");
  ft.append(el("span", "pip"));
  let tail = c.types.find(t => SUMMON_TYPES.includes(t))
          || c.types.find(t => CLASSIC_TYPES.includes(t))
          || (c.types.includes("마법") ? "마법" : c.types.includes("함정") ? "함정" : "몬스터");
  if (c.link != null) tail += ` LINK-${c.link}`;
  else if (c.level != null) tail += ` ★${c.level}`;

function openCard(c) {
  openState = { card: c, flipped: false, artId: c.id };
  paintCard();
  modal.showModal();
}

function paintCard() {
  const { card, flipped } = openState;
  const face = flipped && card.back ? card.back : card;
  const art = (card.arts || []).find(a => a.id === openState.artId);
  const fc = frameVar(face);
  modalBody.textContent = "";
  mtop.style.background = fc;
  modalBody.style.setProperty("--fc", fc);

  const cr = el("div", "closerow");
  const close = el("button", "close", "닫기");
  close.addEventListener("click", () => modal.close());
  cr.append(close);
  modalBody.append(cr);

  const head = el("div", "dhead");
  const shownImg = (!flipped && art && art.img) ? art.img : face.img;
  if (shownImg) {
    const box = el("div", "art");
    const im = el("img"); im.src = shownImg; im.alt = face.name;
    box.append(im); head.append(box);
  }
  const info = el("div", "dinfo");
  if (card.number) info.append(el("div", "dnum", card.number));
  info.append(el("h3", null, face.name));

  if (card.back) {
    const row = el("div", "drow");
    row.append(el("span", "facetag", flipped ? "해방면" : "앞면"));
    const flip = el("button", "flipbtn");
    flip.append(el("span", "sw", "⇄"),
                document.createTextNode(flipped ? "앞면 보기" : "해방면 보기"));
    flip.addEventListener("click", () => { openState.flipped = !flipped; paintCard(); });
    row.append(flip);
    info.append(row);
  }

  const r1 = el("div", "drow");
  const badge = attrBadge(face.attribute, true);
  if (badge) r1.append(badge);
  if (face.link != null) { r1.append(linkGrid(face.markers)); r1.append(el("span", "mono", `LINK-${face.link}`)); }
  else if (face.level != null) r1.append(starRow(face.level, face.types.includes("엑시즈")));
  if (face.scale) r1.append(el("span", "mono", `스케일 ${face.scale[0]} / ${face.scale[1]}`));
  if (r1.children.length) info.append(r1);

  const tl = el("div", "typeline");
  tl.append(el("b", null, face.types.join(" / ")));
  if (face.race) tl.append(document.createTextNode("   " + face.race));
  info.append(tl);

  if (face.atk != null) {
    const ad = el("div", "atkdef");
    const a = el("div"); a.append(el("span", null, "ATK"), el("b", null, face.atk < 0 ? "?" : String(face.atk)));
    ad.append(a);
    if (face.link == null) {
      const d = el("div"); d.append(el("span", null, "DEF"), el("b", null, face.def < 0 ? "?" : String(face.def)));
      ad.append(d);
    }
    info.append(ad);
  }
  head.append(info);
  modalBody.append(head);

  if (!flipped && card.arts && card.arts.length > 1) {
    const strip = el("div", "artstrip");
    strip.append(el("span", "artlabel", `일러스트 ${card.arts.length}종`));
    for (const a of card.arts) {
      const b = el("button", "artbtn");
      b.title = `${a.id} ${a.name}`;
      b.setAttribute("aria-label", a.name);
      if (a.id === openState.artId) b.setAttribute("aria-current", "true");
      if (a.img) {
        const im = el("img"); im.src = a.img; im.alt = ""; im.loading = "lazy";
        b.append(im);
      }
      b.addEventListener("click", () => { openState.artId = a.id; paintCard(); });
      strip.append(b);
    }
    modalBody.append(strip);
  }

  if (face.text) modalBody.append(el("div", "ctext", face.text));

  const labels = face.labels || {};
  const keys = Object.keys(labels);
  if (keys.length) {
    const groups = el("div", "taggroups");
    for (const k of keys) {
      const row = el("div", "taggroup");
      row.append(el("span", "taglabel", k));
      for (const v of labels[k]) row.append(el("span", "tag", v));
      groups.append(row);
    }
    modalBody.append(groups);
  }

  const credits = face.credits || card.credits || [];
  if (credits.length) {
    const row = el("div", "creditrow");
    for (const cc of credits) row.append(el("span", "tag grey", cc));
    modalBody.append(row);
  }

  const shownId = (!flipped && art) ? art.id : face.id;
  modalBody.append(el("div", "note",
    `#${shownId}` + (card.alias ? ` · 원본 ${card.alias}` : "") + ` · ${face.source}`));
}

function route() {

  renderTabs();
  // 덱 에디터만 2단이라 본문을 넓게 쓴다
  document.body.classList.toggle("deckwide", currentTab() === "deck");
  if (h === "packs") renderList();
  else if (h === "deck" || h.startsWith("deck=")) renderDeck(h.startsWith("deck=") ? h.slice(5) : null);
  else if (h === "constants") renderConstants();
  else if (h === "alloc") renderAlloc();
  else if (h === "stats") renderStats();
  else if (h === "decks") renderDeckStats();
  else if (h === "" || h === "cards") renderAllCards();
  else renderPack(h);
  window.scrollTo(0, 0);
}

/* 윌슨 점수 구간 — 표본이 적을 때 단순 승률이 과장되는 걸 막는다 */
function wilson(wins, n, z = 1.96) {
  if (!n) return null;
  const p = wins / n, z2 = z * z;
  const denom = 1 + z2 / n;
  const centre = p + z2 / (2 * n);
  const spread = z * Math.sqrt((p * (1 - p) + z2 / (4 * n)) / n);
  return { p, lo: Math.max(0, (centre - spread) / denom),
           hi: Math.min(1, (centre + spread) / denom) };
}

const MIN_SAMPLE = 20;   // 이보다 적으면 승률을 흐리게 보여준다

let statsSource = "human";   // human | sim | all
let statsBasis = "decks";    // decks(판수) | unique(고유 덱)
let statsZone = "main";      // main(메인+엑스트라) | all(사이드 포함) | side(사이드만)

async function loadStats(force) {
  if (!CONFIG || !CONFIG.statsApi) return null;
  if (stats && stats.source === statsSource && stats.zone === statsZone && !force) return stats;
  const base = CONFIG.statsApi.replace(/\/$/, "");
  const [cards, sum] = await Promise.all([
    grabJson(`${base}/stats/cards?source=${statsSource}&zone=${statsZone}`, null),
    grabJson(`${base}/stats/summary`, null),
  ]);
  if (!cards) return null;
  stats = {
    source: statsSource,
    zone: statsZone,
    by_source: (sum && sum.by_source) || [],
    total_decks: cards.total_decks || 0,
    unique_decks: cards.unique_decks || 0,
    total_duels: (sum && sum.duels) || 0,
    first_at: sum && sum.first_at,
    last_at: sum && sum.last_at,
    byId: new Map((cards.cards || []).map(c => [c.id, c])),
  };
  return stats;
}

  bar.append(filter);

  const srcSel = document.createElement("select");
  srcSel.className = "abtn";
  for (const [v, label] of [["human", "사람 대전"], ["sim", "시뮬레이션"], ["all", "전체"]]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    if (v === statsSource) o.selected = true;
    srcSel.append(o);
  }
  srcSel.addEventListener("change", () => {
    statsSource = srcSel.value;
    renderStats();
  });
  bar.append(srcSel);

  const zoneSel = document.createElement("select");
  zoneSel.className = "abtn";
  for (const [v, label] of [["main", "메인 + 엑스트라"], ["all", "사이드 포함"], ["side", "사이드만"]]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    if (v === statsZone) o.selected = true;
    zoneSel.append(o);
  }
  zoneSel.addEventListener("change", () => { statsZone = zoneSel.value; renderStats(); });
  bar.append(zoneSel);

  const basisSel = document.createElement("select");
  basisSel.className = "abtn";
  for (const [v, label] of [["decks", "판수 기준"], ["unique", "고유 덱 기준"]]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    if (v === statsBasis) o.selected = true;
    basisSel.append(o);
  }
  basisSel.addEventListener("change", () => { statsBasis = basisSel.value; draw(); });
  bar.append(basisSel);

  const sortSel = document.createElement("select");
  sortSel.className = "abtn";
  for (const [v, label] of [["decks", "채용 많은 순"], ["rate", "채용률 순"],
                            ["win", "승률 순"], ["name", "이름순"]]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    sortSel.append(o);
  }
  bar.append(sortSel);
  view.append(bar);

  let data;
  try { data = await loadStats(true); }
  catch { data = null; }
  renderTabs();

  if (!data) {
    sub.textContent = "통계 서버에 연결하지 못했다.";
    view.append(el("p", "empty", "config.json 의 statsApi 주소를 확인해라."));
    return;
  }

  sub.textContent = `듀얼 ${data.total_duels}판 · 덱 ${data.total_decks}개`
    + (data.unique_decks ? ` (서로 다른 레시피 ${data.unique_decks}가지)` : "")
    + "에서 집계했다."
    + (data.total_decks < MIN_SAMPLE * 2
       ? " 아직 표본이 적어 승률은 참고만 해라." : "");

  if (!data.total_decks) {
    view.append(el("p", "empty",
      statsSource === "sim" ? "아직 기록된 시뮬레이션이 없다."
                            : "아직 기록된 듀얼이 없다."));
    return;
  }

  const wrap = el("div", "sheetwrap");
  const table = el("table", "sheet");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  const headCells = [];
  for (const h of ["카드", "번호", "채용률", "채용 덱", "평균 매수", "선택률", "승률"])
    headCells.push(hr.appendChild(el("th", null, h)));
  thead.append(hr);
  table.append(thead);
  const tbody = document.createElement("tbody");
  table.append(tbody);
  wrap.append(table);
  view.append(wrap);

  draw = () => {
    tbody.textContent = "";
    const q = filter.value.trim().toLowerCase();
    const rows = [];
    for (const [id, st] of data.byId) {
      const card = byId.get(id);
      const name = card ? card.name : `#${id}`;
      if (q && !name.toLowerCase().includes(q) && !String(id).includes(q)) continue;
      const decided = st.decided == null ? st.decks : st.decided;
      rows.push({ id, card, name, st, decided, w: wilson(st.wins, decided) });
    }
    const mode = sortSel.value;
    rows.sort((a, b) => {
      if (mode === "name") return a.name.localeCompare(b.name, "ko");
      if (mode === "win") {
        const aw = a.decided >= MIN_SAMPLE && a.w ? a.w.lo : -1;
        const bw = b.decided >= MIN_SAMPLE && b.w ? b.w.lo : -1;
        return bw - aw;
      }
      if (statsBasis === "unique") return (b.st.unique || 0) - (a.st.unique || 0);
      return b.st.decks - a.st.decks;
    });

    headCells[3].textContent = statsBasis === "unique" ? "채용 레시피" : "채용 덱";

    if (!rows.length) {
      const tr = document.createElement("tr");
      const td = el("td", null, "조건에 맞는 카드가 없다.");
      td.colSpan = 7;
      td.style.cssText = "color:var(--fg-faint);padding:22px 12px;text-align:center";
      tr.append(td); tbody.append(tr);
      return;
    }

    for (const r of rows) {
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td");
      const holder = el("div", "statname");
      const pip = el("span", "pip");
      if (r.card) pip.style.setProperty("--fc", frameVar(r.card));
      holder.append(pip, el("b", null, r.name));
      nameTd.append(holder);
      if (r.card) {
        nameTd.style.cursor = "pointer";
        nameTd.addEventListener("click", () => openCard(r.card));
      }
      tr.append(nameTd);

      tr.append(el("td", "id", r.card && r.card.number ? r.card.number : "—"));

      const byUnique = statsBasis === "unique";
      const hit = byUnique ? (r.st.unique || 0) : r.st.decks;
      const base = byUnique ? data.unique_decks : data.total_decks;
      const rate = base ? hit / base : 0;
      const rateTd = document.createElement("td");
      const sb = el("div", "statbar");
      const track = el("div", "track");
      const fill = el("i");
      fill.style.width = Math.max(rate * 100, hit ? 2 : 0) + "%";
      track.append(fill);
      sb.append(track, el("span", "pct", (rate * 100).toFixed(1) + "%"));
      rateTd.append(sb);
      tr.append(rateTd);

      tr.append(el("td", "num", String(hit)));
      tr.append(el("td", "num", (r.st.copies / r.st.decks).toFixed(2)));

      // 분모는 드로우가 아니라 "엔진이 합법적 선택지로 제시한 횟수" 다.
      // 서치·덤핑으로 꺼내 쓰는 비율이 높아 드로우로는 잴 수 없다.
      const useTd = document.createElement("td");
      if (r.st.offered) {
        const ratio = r.st.taken / r.st.offered;
        const box = el("span", "wr" + (ratio < 0.2 ? " thin" : ""));
        box.append(document.createTextNode((ratio * 100).toFixed(0) + "%"));
        box.title = `선택지로 ${r.st.offered}회 제시돼 ${r.st.taken}회 선택`;
        useTd.append(box);
        if (ratio < 0.2) {
          const f = el("span", "thinflag", "미선택");
          f.title = "AI 가 기회를 받고도 거의 고르지 않았다. 이 카드의 승률은 믿을 수 없다";
          useTd.append(f);
        }
      } else if (r.st.decks) {
        const box = el("span", "wr thin", "기회 없음");
        box.title = "합법적 선택지로 제시된 적이 없다. 루트가 성립하지 않았거나 서치되지 않았다";
        useTd.append(box);
      } else {
        useTd.append(el("span", "wr thin", "—"));
      }
      tr.append(useTd);

      const wrTd = document.createElement("td");
      if (!r.w || !r.decided) {
        wrTd.append(el("span", "wr thin", "—"));
      } else {
        const thin = r.decided < MIN_SAMPLE;
        const box = el("span", "wr" + (thin ? " thin" : ""));
        box.append(document.createTextNode((r.w.p * 100).toFixed(1) + "%"));
        box.append(el("span", "ci",
          `${(r.w.lo * 100).toFixed(0)}–${(r.w.hi * 100).toFixed(0)}`));
        wrTd.append(box);
        if (thin) {
          const f = el("span", "thinflag", `n=${r.decided}`);
          f.title = `표본이 ${MIN_SAMPLE}개 미만이라 숫자를 믿기 어렵다`;
          wrTd.append(f);
        }
      }
      tr.append(wrTd);
      tbody.append(tr);
    }
  };

  filter.addEventListener("input", () => draw());
  sortSel.addEventListener("change", () => draw());

  draw();

  if (statsZone !== "main") {
    const sideNote = el("p", "hint");
    sideNote.style.cssText = "margin-top:12px;font-size:11.5px;color:var(--fg-faint);line-height:1.7";
    sideNote.textContent =
      "호스트가 보내는 덱은 사이드 교체가 끝난 상태다. 매치 2·3차전에서는 사이드로 넘어간 "
      + "메인 카드가 사이드에 섞여 있으므로, 원래 사이드 덱 구성을 보려면 1차전 기록만 봐야 한다.";
    view.append(sideNote);
  }

  const note = el("p", "hint");
  note.style.cssText = "margin-top:14px;font-size:11.5px;color:var(--fg-faint);line-height:1.7";
  note.textContent =
    "승률 옆 작은 숫자는 95% 신뢰구간이다. 구간이 넓으면 아직 판단하기 이르다는 뜻이다. "
    + "강한 덱에 들어간 카드는 그 카드가 강해서가 아니라 덱이 강해서 승률이 높게 나올 수 있으니, "
    + "채용률과 같이 보는 편이 낫다. 무승부는 승률 분모에서 빠진다. "
    + "선택률은 엔진이 그 카드를 합법적 선택지로 제시한 횟수 대비 AI 가 실제로 고른 횟수다 "
    + "(드로우가 아니라 기회가 분모다 — 서치·덤핑으로 꺼내 쓰는 비율이 높기 때문이다). "
    + "낮으면 카드가 약한 게 아니라 AI 가 쓸 줄 모르는 것이므로 승률을 근거로 쓰지 않는 편이 낫다. "
    + "'기회 없음' 은 또 달라서, 루트가 성립하지 않았거나 서치되지 않았다는 뜻이다. "
    + "전개 루트로 엮인 카드들은 선택률이 서로 같게 나오므로, 어느 파츠가 중요한지는 "
    + "그 카드를 빼고 같은 덱을 돌리는 A/B 로만 알 수 있다. 시뮬레이션에서만 기록된다.";
  view.append(note);
}

/* ---------- 덱 통계 ---------- */
let deckSource = "human";

async function renderDeckStats() {
  document.title = "덱 통계 — CyanPro Card Database";
  view.textContent = "";

  const head = el("div", "pagehead");
  head.append(el("h2", null, "덱 통계"));
  const sub = el("p", null, "불러오는 중…");
  head.append(sub);
  view.append(head);

  const bar = el("div", "toolbar");
  const srcSel = document.createElement("select");
  srcSel.className = "abtn";
  for (const [v, label] of [["human", "사람 대전"], ["sim", "시뮬레이션"], ["all", "전체"]]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    if (v === deckSource) o.selected = true;
    srcSel.append(o);
  }
  srcSel.addEventListener("change", () => { deckSource = srcSel.value; renderDeckStats(); });
  bar.append(srcSel);
  view.append(bar);

  let decks = null;
  if (CONFIG && CONFIG.statsApi) {
    const base = CONFIG.statsApi.replace(/\/$/, "");
    const res = await grabJson(`${base}/stats/decks?source=${deckSource}`, null);
    decks = res && res.decks;
  }
  deckStats = decks;
  renderTabs();

  if (!decks) {
    sub.textContent = "통계 서버에 연결하지 못했다.";
    return;
  }
  if (!decks.length) {
    sub.textContent = "아직 집계할 덱이 없다.";
    view.append(el("p", "empty",
      "매치가 기록되면 여기 나온다. CyanPro 가 player_no 를 보내야 매치를 묶을 수 있다."));
    return;
  }

  sub.textContent = `서로 다른 레시피 ${decks.length}가지. `
    + "매치 1차전 덱을 그 매치의 레시피로 보고, 사이드 교체한 2·3차전 결과까지 함께 센다.";

  const wrap = el("div", "sheetwrap");
  const table = el("table", "sheet");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  for (const h of ["레시피", "매치", "매치 승률", "듀얼", "듀얼 승률", "조종자", "구성"])
    hr.append(el("th", null, h));
  thead.append(hr);
  table.append(thead);
  const tbody = document.createElement("tbody");

  const pct = (w, n) => {
    if (!n) return el("span", "wr thin", "—");
    const r = wilson(w, n);
    const thin = n < MIN_SAMPLE;
    const box = el("span", "wr" + (thin ? " thin" : ""));
    box.append(document.createTextNode((r.p * 100).toFixed(0) + "%"));
    box.append(el("span", "ci", `${(r.lo * 100).toFixed(0)}–${(r.hi * 100).toFixed(0)}`));
    return box;
  };

  for (const d of decks) {
    const tr = document.createElement("tr");
    tr.className = "deckrow";

    const nameTd = document.createElement("td");
    const top = (d.deck.main || []).slice()
      .sort((a, b) => b.qty - a.qty)
      .map(c => (byId.get(c.id) || {}).name)
      .filter(Boolean).slice(0, 2).join(" · ");
    const holder = el("div", "statname");
    holder.append(el("b", null, top || "구성 없음"));
    nameTd.append(holder, el("div", "rec", d.hash.slice(0, 10)));
    tr.append(nameTd);

    tr.append(el("td", "num", String(d.matches)));
    const mw = document.createElement("td"); mw.append(pct(d.match_wins, d.matches)); tr.append(mw);
    tr.append(el("td", "num", String(d.duels)));
    const dw = document.createElement("td"); dw.append(pct(d.duel_wins, d.duels)); tr.append(dw);
    tr.append(el("td", "num", String(d.pilots || 0)));

    const openTd = document.createElement("td");
    const total = (d.deck.main || []).reduce((a, c) => a + c.qty, 0);
    const btn = el("button", null, `${total}장 보기`);
    btn.style.cssText = "font-size:11.5px;color:var(--accent);text-decoration:underline;padding:0";
    const sub2 = document.createElement("tr");
    sub2.className = "subrow"; sub2.hidden = true;
    const subtd = document.createElement("td");
    subtd.colSpan = 7;
    const box = el("div", "deckbox");
    for (const [zone, label] of [["main", "메인"], ["extra", "엑스트라"], ["side", "사이드"]]) {
      const list = d.deck[zone] || [];
      if (!list.length) continue;
      const sec = el("div", "zone");
      const n = list.reduce((a, c) => a + c.qty, 0);
      sec.append(el("h4", null, `${label} ${n}`));
      const ul = el("div", "decklist");
      for (const c of list.slice().sort((a, b) => b.qty - a.qty)) {
        const card = byId.get(c.id);
        const chip = el("span");
        chip.append(document.createTextNode(card ? card.name : `#${c.id}`));
        if (c.qty > 1) chip.append(el("b", null, "×" + c.qty));
        if (card) {
          chip.style.cursor = "pointer";
          chip.addEventListener("click", () => openCard(card));
        }
        ul.append(chip);
      }
      sec.append(ul);
      box.append(sec);
    }
    subtd.append(box); sub2.append(subtd);
    let open = false;
    btn.addEventListener("click", () => {
      open = !open; sub2.hidden = !open;
      btn.textContent = open ? "접기" : `${total}장 보기`;
    });
    openTd.append(btn);
    tr.append(openTd);

    tbody.append(tr, sub2);
  }
  table.append(tbody);
  wrap.append(table);
  view.append(wrap);

  const note = el("p", "hint");
  note.style.cssText = "margin-top:14px;font-size:11.5px;color:var(--fg-faint);line-height:1.7";
  note.textContent =
    "레시피는 메인과 엑스트라 구성으로만 구분한다. 사이드가 달라도 같은 덱으로 본다. "
    + "자리는 매치 중간에 뒤집히므로 seat 이 아니라 player_no 로 사람을 묶는다. "
    + "승률 옆 작은 숫자는 95% 신뢰구간이고, 표본이 적으면 흐리게 나온다. "
    + "카드별 승률과 달리 이 숫자는 덱 전체의 성적이라 '강한 덱에 든 카드' 교란이 없다.";
  view.append(note);
}

/* ---------- 할당 현황 ---------- */
const fmtId = n => String(n);

function renderAlloc() {
  document.title = "할당 현황 — CyanPro Card Database";
  view.textContent = "";

  const head = el("div", "pagehead");
  head.append(el("h2", null, "할당 현황"));
  const totalReserved = allocations.ranges.reduce((a, r) => a + r.size, 0);
  const totalUsed = allocations.ranges.reduce((a, r) => a + r.used, 0);
  head.append(el("p", null,
    `예약 구간 ${allocations.ranges.length}개 · ID ${totalUsed}/${totalReserved} 사용 · 카드군 ${allocations.setcodes.length}개`));
  view.append(head);

  if (allocations.issues && allocations.issues.length) {
    const box = el("div", "warnbox");
    box.append(el("h3", null, `확인이 필요한 항목 ${allocations.issues.length}건`));
    const ul = document.createElement("ul");
    ul.style.cssText = "margin:0;padding-left:18px;font-size:12.3px;line-height:1.7;color:var(--fg-dim)";
    for (const it of allocations.issues) ul.append(el("li", null, it.detail));
    box.append(ul);
    view.append(box);
  }

  /* --- ID 구간 --- */
  const h1 = el("div", "secthead");
  h1.append(el("h3", null, "ID 구간"));
  h1.append(el("span", null, "9자리 카드 번호 · 카드군과 독립"));
  view.append(h1);

  const wrap1 = el("div", "sheetwrap");
  const t1 = el("table", "sheet");
  const thead1 = document.createElement("thead");
  const hr1 = document.createElement("tr");
  for (const h of ["구간", "담당", "용도", "사용량", "다음 빈 번호", "상태", "비고"])
    hr1.append(el("th", null, h));
  thead1.append(hr1);
  t1.append(thead1);

  const tb1 = document.createElement("tbody");
  if (!allocations.ranges.length) {
    const tr = document.createElement("tr");
    const td = el("td", null, "아직 예약된 구간이 없다. allocations.json 에 추가하면 여기 나온다.");
    td.colSpan = 7; td.style.cssText = "color:var(--fg-faint);padding:22px 12px;text-align:center";
    tr.append(td); tb1.append(tr);
  }
  for (const r of allocations.ranges) {
    const tr = document.createElement("tr");
    tr.append(el("td", "id", `${fmtId(r.from)} – ${fmtId(r.to)}`));
    tr.append(el("td", "who" + (r.owner ? "" : " none"), r.owner || "미배정"));
    tr.append(el("td", null, r.purpose || "—"));

    const g = el("td");
    const gauge = el("div", "gauge");
    const bar = el("div", "gbar");
    const fill = el("i");
    const pct = r.size ? Math.round(r.used / r.size * 100) : 0;
    fill.style.width = Math.max(pct, r.used ? 3 : 0) + "%";
    if (pct >= 100) fill.className = "full";
    else if (pct >= 80) fill.className = "high";
    bar.append(fill);
    gauge.append(bar, el("span", "gnum", `${r.used}/${r.size}`));
    g.append(gauge);
    tr.append(g);

    tr.append(el("td", "id", r.next_free == null ? "가득 참" : fmtId(r.next_free)));
    const st = el("td");
    st.append(el("span", "statetag " + (r.status === "active" ? "active" : "done"),
                 r.status === "active" ? "진행 중" : r.status));
    tr.append(st);

    const note = el("td", "rowcards");
    note.append(document.createTextNode(r.note || ""));
    if (r.cards && r.cards.length) {
      if (r.note) note.append(document.createTextNode(" "));
      const btn = el("button", null, `카드 ${r.cards.length}장 보기`);
      let open = false;
      const sub = document.createElement("tr");
      sub.className = "subrow";
      sub.hidden = true;
      const subtd = document.createElement("td");
      subtd.colSpan = 7;
      const list = el("div", "cardlist");
      for (const c of r.cards) list.append(el("span", null, `${c.id} ${c.name}`));
      subtd.append(list);
      sub.append(subtd);
      btn.addEventListener("click", () => {
        open = !open;
        sub.hidden = !open;
        btn.textContent = open ? "접기" : `카드 ${r.cards.length}장 보기`;
      });
      note.append(btn);
      tr.append(note);
      tb1.append(tr, sub);
      continue;
    }
    tr.append(note);
    tb1.append(tr);
  }
  t1.append(tb1);
  wrap1.append(t1);
  view.append(wrap1);

  /* --- 카드군 코드 --- */
  const h2 = el("div", "secthead");
  h2.append(el("h3", null, "카드군 코드"));
  h2.append(el("span", null, "setcode · 0x300 부터 · ID 구간과 독립"));
  view.append(h2);

  const wrap2 = el("div", "sheetwrap");
  const t2 = el("table", "sheet");
  t2.style.minWidth = "480px";
  const thead2 = document.createElement("thead");
  const hr2 = document.createElement("tr");
  for (const h of ["코드", "카드군", "담당", "사용 카드", "비고"]) hr2.append(el("th", null, h));
  thead2.append(hr2);
  t2.append(thead2);
  const tb2 = document.createElement("tbody");
  if (!allocations.setcodes.length) {
    const tr = document.createElement("tr");
    const td = el("td", null, "아직 할당된 카드군 코드가 없다.");
    td.colSpan = 5; td.style.cssText = "color:var(--fg-faint);padding:22px 12px;text-align:center";
    tr.append(td); tb2.append(tr);
  }
  for (const sc of allocations.setcodes) {
    const tr = document.createElement("tr");
    tr.append(el("td", "code", sc.code));
    tr.append(el("td", null, sc.name || "—"));
    tr.append(el("td", "who" + (sc.owner ? "" : " none"), sc.owner || "미배정"));

    const uc = el("td", "num");
    if (sc.used) {
      const btn = el("button", null, `${sc.used}장`);
      btn.style.cssText = "font-family:var(--font-mono);color:var(--accent);text-decoration:underline;padding:0";
      const sub = document.createElement("tr");
      sub.className = "subrow"; sub.hidden = true;
      const subtd = document.createElement("td");
      subtd.colSpan = 5;
      const list = el("div", "cardlist");
      for (const c of sc.cards) list.append(el("span", null, `${c.id} ${c.name}`));
      subtd.append(list); sub.append(subtd);
      let open = false;
      btn.addEventListener("click", () => {
        open = !open; sub.hidden = !open;
        btn.textContent = open ? "접기" : `${sc.used}장`;
      });
      uc.append(btn);
      tr.append(uc, el("td", "rowcards", sc.note || ""));
      tb2.append(tr, sub);
      continue;
    }
    uc.append(el("span", null, "0"));
    uc.style.color = "var(--fg-faint)";
    tr.append(uc, el("td", "rowcards", sc.note || ""));
    tb2.append(tr);
  }
  t2.append(tb2);
  wrap2.append(t2);
  view.append(wrap2);

  /* --- 추가 방법 --- */
  const how = el("div", "howto");
  how.append(el("h3", null, "추가하려면"));
  how.append(el("p", null,
    "리포의 allocations.json 을 고치고 커밋하면 다음 빌드에 반영된다. 쓰기 권한이 있는 사람만 고칠 수 있다. " +
    "ID 구간과 카드군 코드는 서로 묶이지 않으므로 각자 필요한 쪽만 추가하면 된다."));
  const pre = document.createElement("pre");
  pre.textContent = `"ranges": [
  { "from": 130000100, "to": 130000199,
    "owner": "스크립터 이름",
    "purpose": "범용 팩",       // 자유 텍스트
    "note": "", "status": "active" }
],
"setcodes": [
  { "code": "0x301", "name": "카드군 이름",
    "owner": "스크립터 이름", "note": "" }
]`;
  how.append(pre);
  view.append(how);
}

/* ---------- 코드 일람 ---------- */
function renderConstants() {
  document.title = "코드 일람 — CyanPro Card Database";
  view.textContent = "";

  const head = el("div", "pagehead");
  head.append(el("h2", null, "코드 일람"));
  head.append(el("p", null, constants.source
    ? `CyanCore 엔진의 ${constants.source} 에서 생성했다. 스크립트를 짤 때 이 값이 실제 동작 기준이다.`
    : "엔진 리포를 찾지 못해 비어 있다."));
  view.append(head);

  if (constants.drift && constants.drift.length) {
    const box = el("div", "warnbox");
    box.append(el("h3", null, "constant.lua 와 어긋나는 값"));
    box.append(el("p", null,
      "카드 리포의 script/constant.lua 는 EDOPro 원본이라, CyanCore 가 다시 할당한 비트를 다른 이름으로 알고 있다. " +
      "아래 이름을 스크립트에 쓰면 엔진은 오른쪽 의미로 처리한다."));
    const tbl = el("table", "drifttable");
    const thead = document.createElement("tr");
    for (const h of ["값", "constant.lua", "CyanCore 실제"]) thead.append(el("th", null, h));
    tbl.append(thead);
    for (const d of constants.drift) {
      const tr = document.createElement("tr");
      if (d.kind === "name") {
        tr.append(el("td", null, d.value), el("td", "bad", d.lua), el("td", "good", d.engine));
      } else {
        tr.append(el("td", null, d.name), el("td", "bad", d.lua), el("td", "good", d.engine));
      }
      tbl.append(tr);
    }
    box.append(tbl);
    view.append(box);
  }

  const bar = el("div", "toolbar");
  const filter = el("input", "filter");
  filter.type = "search";
  filter.placeholder = "상수명 · 값 검색 (예: TYPE_, 0x8000)";
  bar.append(filter);
  view.append(bar);

  const host = el("div");
  const custom = new Set([...(constants.custom || []),
                          ...(constants.drift || []).map(d => d.engine)]);
  const draw = q => {
    host.textContent = "";
    const n = q.trim().toLowerCase();
    let shown = 0;
    for (const g of constants.groups) {
      const hits = g.entries.filter(e => !n ||
        e.name.toLowerCase().includes(n) ||
        e.value.toLowerCase().includes(n) ||
        (e.note || "").toLowerCase().includes(n));
      if (!hits.length) continue;
      shown += hits.length;
      const sec = el("div", "constgroup");
      sec.append(el("h3", null, g.prefix));
      const wrap = el("div", "constwrap");
      const tbl = el("table", "consttable");
      const tr = document.createElement("tr");
      for (const h of ["이름", "값", "비고"]) tr.append(el("th", null, h));
      tbl.append(tr);
      for (const e of hits) {
        const row = document.createElement("tr");
        if (custom.has(e.name)) row.className = "custom";
        row.append(el("td", "nm", e.name), el("td", "vl", e.value), el("td", "nt", e.note || ""));
        tbl.append(row);
      }
      wrap.append(tbl);
      sec.append(wrap);
      host.append(sec);
    }
    if (!shown) host.append(el("p", "empty", "조건에 맞는 상수가 없다."));
  };
  filter.addEventListener("input", () => draw(filter.value));
  view.append(host);
  draw("");
}
window.addEventListener("hashchange", route);
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
modal.addEventListener("close", () => { openState = null; });
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "f" && modal.open && openState && openState.card.back) {
    openState.flipped = !openState.flipped; paintCard();
  }
});
/* ---------- 관리: 지금 다시 빌드 ---------- */
const REPO = "pendulums58/OricaWeb";
const WORKFLOW = "pages.yml";
const TOKEN_KEY = "orica_admin_token";

const readToken = () => {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
};
const writeToken = v => {
  try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch {}
};

const adminHost = document.getElementById("adminHost");
let adminOpen = false;

document.getElementById("gearBtn").addEventListener("click", () => {
  adminOpen = !adminOpen;
  adminHost.hidden = !adminOpen;
  if (adminOpen) renderAdmin();
});

function renderAdmin() {
  adminHost.textContent = "";
  const box = el("div", "adminpanel");
  box.append(el("h3", null, "지금 다시 빌드"));
  box.append(el("p", null,
    "카드 리포에 push 한 내용은 다음 정기 빌드(매시 17분)까지 사이트에 반영되지 않는다. " +
    "바로 반영하려면 여기서 빌드를 직접 돌린다. 토큰은 이 브라우저에만 저장되며 다른 사람에게 전달되지 않는다."));

  const row = el("div", "adminrow");
  const input = document.createElement("input");
  input.type = "password";
  input.placeholder = "GitHub 토큰 (Actions: write)";
  input.value = readToken();
  input.autocomplete = "off";

  const save = el("button", "abtn", "저장");
  const go = el("button", "abtn go", "지금 다시 빌드");
  const clear = el("button", "abtn", "토큰 삭제");
  row.append(input, save, go, clear);
  box.append(row);

  const status = el("div", "astatus");
  box.append(status);

  const say = (msg, cls) => { status.className = "astatus " + (cls || ""); status.textContent = msg; };

  save.addEventListener("click", () => {
    writeToken(input.value.trim());
    say(input.value.trim() ? "저장했다." : "토큰을 비웠다.", "ok");
  });
  clear.addEventListener("click", () => {
    writeToken(""); input.value = ""; say("토큰을 지웠다.", "ok");
  });

  go.addEventListener("click", async () => {
    const token = input.value.trim() || readToken();
    if (!token) { say("먼저 토큰을 넣어야 한다.", "err"); return; }
    writeToken(token);
    go.disabled = true;
    say("빌드를 요청하는 중…");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
        { method: "POST",
          headers: { "Accept": "application/vnd.github+json",
                     "Authorization": `Bearer ${token}`,
                     "X-GitHub-Api-Version": "2022-11-28" },
          body: JSON.stringify({ ref: "main" }) });
      if (res.status === 204) {
        say("빌드를 시작했다. 1~2분 뒤 새로고침을 누르면 반영된다.", "ok");
      } else if (res.status === 401 || res.status === 403) {
        say("토큰이 거부됐다. Actions 쓰기 권한이 있는지 확인해라.", "err");
      } else if (res.status === 404) {
        say("워크플로를 찾지 못했다. 토큰 권한이나 리포 이름을 확인해라.", "err");
      } else {
        const body = await res.text();
        say(`실패 (${res.status}) ${body.slice(0, 120)}`, "err");
      }
    } catch (e) {
      say("요청을 보내지 못했다: " + e.message, "err");
    }
    go.disabled = false;
  });

  adminHost.append(box);
}

const refreshBtn = document.getElementById("refreshBtn");
const refreshLabel = document.getElementById("refreshLabel");
refreshBtn.addEventListener("click", async () => {
  refreshBtn.disabled = true;
  refreshBtn.classList.add("spin");
  refreshLabel.textContent = "받는 중";
  const before = JSON.stringify([allCards.length, packs.length,
                                 allCards.map(c => c.id)]);
  try {
    await loadAll();
    route();
    const after = JSON.stringify([allCards.length, packs.length,
                                  allCards.map(c => c.id)]);
    refreshLabel.textContent = before === after ? "변경 없음" : "갱신됨";
  } catch (e) {
    refreshLabel.textContent = "실패";
  }
  refreshBtn.classList.remove("spin");
  setTimeout(() => {
    refreshLabel.textContent = "새로고침";
    refreshBtn.disabled = false;
  }, 1800);
});

setInterval(showBuiltAt, 60000);

loadAll().then(route).catch(err => {
  view.textContent = "";
  const box = el("div", "loading");
  box.append(el("div", null, "카드 데이터를 불러오지 못했다"));
  box.append(el("div", "step", err.message));
  const retry = el("button", "abtn", "다시 시도");
  retry.style.marginTop = "14px";
  retry.addEventListener("click", () => loadAll().then(route).catch(() => {}));
  box.append(retry);
  view.append(box);
});
</script>
