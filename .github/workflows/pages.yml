name: Build and deploy pack site

on:
  push:
    branches: [main]
  schedule:
    # 카드 데이터는 브라우저가 직접 읽으므로 빌드를 기다리지 않는다.
    # 이 주기 빌드는 이미지 webp 를 따라잡기 위한 것뿐이다.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch card repo (이미지용)
        run: git clone --depth 1 https://github.com/pendulums58/CyanPro_CardDB.git packs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Build pack data
        run: python build.py

      - name: Show report
        run: cat dist/report.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
