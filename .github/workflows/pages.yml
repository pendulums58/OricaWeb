name: Build and deploy pack site

on:
  push:
    branches: [main]
  schedule:
    # 카드 리포에 새 카드가 들어와도 이 리포는 가만히 있으므로,
    # 6시간마다 다시 빌드해서 반영한다.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch card repo
        run: git clone --depth 1 https://github.com/pendulums58/CyanPro_CardDB.git packs

      - name: Fetch engine repo (코드 일람용)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/pendulums58/CyanPro.git engine
          git -C engine sparse-checkout set gframe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Build pack data
        run: python build.py

      - name: Show report
        run: cat dist/report.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
